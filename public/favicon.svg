<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <!-- Deep forest emerald rounded background for high contrast on light and dark browser tabs -->
    <rect width="128" height="128" rx="34" fill="#1b4332"/>
    
    <!-- Subtle circular ring for depth -->
    <circle cx="64" cy="64" r="52" stroke="#5ad01f" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Botanical shoot / flourishing dual leaves: symbol of renewal, emotional resilience, and calm -->
    <!-- Left leaf in calming warm cream -->
    <path d="M64 98 C64 70 40 50 28 48 C28 76 44 94 64 98 Z" fill="#faf9f6"/>
    
    <!-- Right ascending leaf in spring green accent -->
    <path d="M64 98 C64 54 88 30 100 22 C100 56 82 88 64 98 Z" fill="#5ad01f"/>
    
    <!-- Delicate central vein line -->
    <path d="M64 98 C64 72 72 50 82 38" stroke="#1b4332" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Serene mindfulness accent dot -->
    <circle cx="64" cy="22" r="5" fill="#5ad01f"/>
</svg>
